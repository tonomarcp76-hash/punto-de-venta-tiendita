<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Tiendita - POS</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
        body{background:#f0f4f8;padding:20px;max-width:1000px;margin:0 auto;}
        h1{text-align:center;background:#2c3e50;color:white;padding:20px;border-radius:8px;margin-bottom:20px;}
        
        .menu{display:flex;justify-content:center;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
        .btn-menu{padding:12px 25px;border:none;border-radius:6px;font-size:16px;cursor:pointer;background:#3498db;color:white;transition:all 0.2s;}
        .btn-menu.activo{background:#27ae60;transform:scale(1.05);}
        .btn-menu:hover{opacity:0.9;}
        
        .pagina{display:none;background:white;padding:25px;border-radius:8px;box-shadow:0 2px 8px #0002;}
        .pagina.activa{display:block;}
        h2{color:#2c3e50;margin-bottom:20px;text-align:center;}
        
        button{padding:8px 15px;border:none;border-radius:4px;cursor:pointer;font-size:14px;}
        .btn-verde{background:#27ae60;color:white;}
        .btn-rojo{background:#e74c3c;color:white;}
        .btn-azul{background:#3498db;color:white;}
        button:hover{opacity:0.85;}
        
        table{width:100%;border-collapse:collapse;margin:15px 0;}
        th,td{padding:10px;text-align:left;border-bottom:1px solid #ddd;}
        th{background:#2c3e50;color:white;}
        
        .total{text-align:right;font-size:24px;font-weight:bold;color:#27ae60;margin-top:15px;}
        .acciones{text-align:center;margin-top:20px;}
    </style>
</head>
<body>

    <h1>🛒 MI TIENDITA</h1>

    <div class="menu">
        <button class="btn-menu activo" id="btn-ventas" onclick="mostrarPagina('ventas')">Nueva Venta</button>
        <button class="btn-menu" id="btn-productos" onclick="mostrarPagina('productos')">Productos</button>
        <button class="btn-menu" id="btn-caja" onclick="mostrarPagina('caja')">Caja</button>
    </div>

    <!-- ====== PÁGINA VENTAS ====== -->
    <div id="ventas" class="pagina activa">
        <h2>🧾 Nueva Venta</h2>
        <button class="btn-verde" onclick="agregarItem()">➕ Agregar Producto</button>
        <table id="tablaVenta">
            <thead>
                <tr><th>Producto</th><th>Cantidad</th><th>Precio</th><th>Subtotal</th><th>Eliminar</th></tr>
            </thead>
            <tbody id="cuerpoVenta"></tbody>
        </table>
        <div class="total">Total: $<span id="totalVenta">0.00</span></div>
        <div class="acciones">
            <button class="btn-rojo" onclick="limpiarVenta()">🗑️ Limpiar</button>
            <button class="btn-verde" onclick="cobrar()">✅ Cobrar</button>
        </div>
    </div>

    <!-- ====== PÁGINA PRODUCTOS ====== -->
    <div id="productos" class="pagina">
        <h2>📦 Lista de Productos</h2>
        <button class="btn-verde" onclick="agregarProducto()">➕ Nuevo Producto</button>
        <table id="tablaProductos">
            <thead>
                <tr><th>Nombre</th><th>Precio</th><th>Stock</th><th>Eliminar</th></tr>
            </thead>
            <tbody id="cuerpoProductos"></tbody>
        </table>
    </div>

    <!-- ====== PÁGINA CAJA ====== -->
    <div id="caja" class="pagina">
        <h2>💰 Caja del Día</h2>
        <p style="font-size:18px;margin:10px 0;"><strong>Fecha:</strong> <span id="fecha"></span></p>
        <p style="font-size:18px;margin:10px 0;"><strong>Ventas realizadas:</strong> <span id="cantidadVentas">0</span></p>
        <p style="font-size:22px;margin-top:20px;"><strong>Total en Caja:</strong> $<span id="totalCaja">0.00</span></p>
        <br>
        <button class="btn-rojo" onclick="cerrarCaja()">🔄 Reiniciar Día</button>
    </div>

<script>
// DATOS
let productos = JSON.parse(localStorage.getItem('misProductos')) || [];
let carrito = [];
let totalCaja = parseFloat(localStorage.getItem('totalCaja')) || 0;
let cantidadVentas = parseInt(localStorage.getItem('cantidadVentas')) || 0;

// FECHA
document.getElementById('fecha').textContent = new Date().toLocaleDateString('es-MX',{
    weekday:'long',year:'numeric',month:'long',day:'numeric'
});
actualizarCaja();
actualizarTablaProductos();

// ✅ FUNCIÓN CORREGIDA PARA CAMBIAR DE PÁGINA
function mostrarPagina(nombre){
    // Quitar activo de todos los botones
    document.querySelectorAll('.btn-menu').forEach(boton => boton.classList.remove('activo'));
    // Ocultar todas las páginas
    document.querySelectorAll('.pagina').forEach(pagina => pagina.classList.remove('activa'));
    // Activar el botón y la página seleccionada
    document.getElementById('btn-' + nombre).classList.add('activo');
    document.getElementById(nombre).classList.add('activa');
}

// AGREGAR PRODUCTO AL CATÁLOGO
function agregarProducto(){
    let nombre = prompt('Nombre del producto:');
    if(!nombre) return;
    let precio = parseFloat(prompt('Precio de venta:'));
    if(isNaN(precio)||precio<=0){alert('Precio inválido');return;}
    let stock = parseInt(prompt('Cantidad disponible:'));
    if(isNaN(stock)||stock<0){alert('Cantidad inválida');return;}
    
    productos.push({nombre,precio,stock});
    guardarProductos();
    actualizarTablaProductos();
}

function guardarProductos(){
    localStorage.setItem('misProductos',JSON.stringify(productos));
}

function actualizarTablaProductos(){
    let cuerpo = document.getElementById('cuerpoProductos');
    cuerpo.innerHTML='';
    productos.forEach((p,i)=>{
        cuerpo.innerHTML += `
            <tr>
                <td>${p.nombre}</td>
                <td>$${p.precio.toFixed(2)}</td>
                <td>${p.stock}</td>
                <td><button class="btn-rojo" onclick="borrarProducto(${i})">X</button></td>
            </tr>
        `;
    });
}

function borrarProducto(i){
    if(confirm('¿Eliminar producto?')){
        productos.splice(i,1);
        guardarProductos();
        actualizarTablaProductos();
    }
}

// AGREGAR A VENTA
function agregarItem(){
    if(productos.length===0){alert('Primero agrega productos en la pestaña Productos');return;}
    let lista = productos.map((p,i)=>`${i+1}. ${p.nombre} - $${p.precio.toFixed(2)}`).join('\n');
    let opcion = parseInt(prompt('Elige el número del producto:\n\n'+lista))-1;
    if(isNaN(opcion)||opcion<0||opcion>=productos.length) return;
    
    let cant = parseInt(prompt('Cantidad:'));
    if(isNaN(cant)||cant<=0){alert('Cantidad inválida');return;}
    
    let p = productos[opcion];
    carrito.push({nombre:p.nombre,cantidad:cant,precio:p.precio});
    actualizarTablaVenta();
}

function actualizarTablaVenta(){
    let cuerpo = document.getElementById('cuerpoVenta');
    cuerpo.innerHTML='';
    let total = 0;
    carrito.forEach((item,i)=>{
        let subtotal = item.cantidad * item.precio;
        total += subtotal;
        cuerpo.innerHTML += `
            <tr>
                <td>${item.nombre}</td>
                <td>${item.cantidad}</td>
                <td>$${item.precio.toFixed(2)}</td>
                <td>$${subtotal.toFixed(2)}</td>
                <td><button class="btn-rojo" onclick="quitarItem(${i})">X</button></td>
            </tr>
        `;
    });
    document.getElementById('totalVenta').textContent = total.toFixed(2);
}

function quitarItem(i){
    carrito.splice(i,1);
    actualizarTablaVenta();
}

function limpiarVenta(){
    carrito=[];
    actualizarTablaVenta();
}

function cobrar(){
    if(carrito.length===0){alert('No hay productos en la venta');return;}
    let total = carrito.reduce((sum,i)=>sum + i.cantidad*i.precio,0);
    if(confirm(`Total a pagar: $${total.toFixed(2)}\n\n¿Venta cobrada?`)){
        totalCaja += total;
        cantidadVentas++;
        localStorage.setItem('totalCaja',totalCaja);
        localStorage.setItem('cantidadVentas',cantidadVentas);
        actualizarCaja();
        limpiarVenta();
        alert('✅ ¡Venta registrada!');
    }
}

function actualizarCaja(){
    document.getElementById('totalCaja').textContent = totalCaja.toFixed(2);
    document.getElementById('cantidadVentas').textContent = cantidadVentas;
}

function cerrarCaja(){
    if(confirm('¿Reiniciar caja del día? Se perderá el total acumulado.')){
        totalCaja=0;
        cantidadVentas=0;
        localStorage.setItem('totalCaja','0');
        localStorage.setItem('cantidadVentas','0');
        actualizarCaja();
    }
}
</script>
</body>
</html>
